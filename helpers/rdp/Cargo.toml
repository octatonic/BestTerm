# A workspace of its own, and not by preference.
#
# `ironrdp-connector` pins `picky = "=7.0.0-rc.25"`, which pins
# `ecdsa = "=0.17.0-rc.22"`. `russh` requires `ecdsa = "^0.17"`, and a caret
# requirement does not match a pre-release. Both land in the same semver
# compatibility range, so one dependency graph has to choose one of them — which
# means SSH and RDP cannot live in the same graph until IronRDP unpins picky.
#
# Splitting them is not a workaround so much as the existing boundary applied one
# level down. The RDP code already runs in a process of its own, for crash
# isolation and an independent release cycle (docs/ARCHITECTURE.md). Giving that
# process its own dependency graph follows from the same decision, and it means a
# release-candidate pin deep inside one protocol cannot hold the other hostage.
#
# The shared crates — ipc-frame, surface, core-vault — are referenced by path and
# compiled twice, once per workspace. None of them depends on russh or picky, so
# there is nothing for them to conflict over. The cost is build time, which is
# worth less than either protocol waiting on the other.

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# The floor the dependency tree actually imposes, not an aspiration. egui 0.36
# requires 1.95, so nothing older can build this at all.
#
# Understating it is not harmless: cargo resolves to the newest versions its
# MSRV allows, so a low number here makes it choose *older* dependencies. That is
# how `time` was being pinned to 0.3.45 -- every release carrying the fix for
# RUSTSEC-2026-0009 declares 1.88, so a claimed MSRV of 1.85 selected the
# vulnerable one on purpose. An MSRV is a promise about what builds; a wrong one
# is a promise about which security fixes are skipped.
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/octatonic/BestTerm"
homepage = "https://github.com/octatonic/BestTerm"
authors = ["BestTerm contributors"]

[workspace.dependencies]
# ---- shared with the main workspace, by path ------------------------------------
# The version is carried alongside the path even though resolution never uses it:
# a path dependency without one reads as a wildcard requirement, which `deny.toml`
# refuses on purpose. It has to be kept in step with the main workspace by hand.
bestterm-ipc-frame = { path = "../../crates/ipc-frame", version = "0.1.0" }
bestterm-surface = { path = "../../crates/surface", version = "0.1.0" }
bestterm-core-vault = { path = "../../crates/core-vault", version = "0.1.0" }

# ---- IronRDP -------------------------------------------------------------------
# MIT OR Apache-2.0, from Devolutions. Chosen over FreeRDP bindings because it is
# pure Rust and builds on both targets without a C toolchain.
#
# The individual crates rather than the `ironrdp` facade: the facade does not cover
# the tokio and TLS adapters, so half the tree would come in through it and half
# around it. `ironrdp-connector` 0.10 pins `ironrdp-pdu` 0.9, which is why these
# two versions go together.
ironrdp-connector = "0.10"
ironrdp-pdu = { version = "0.9", features = ["std"] }
# The active stage: everything after the handshake. `ironrdp-session` 0.11 pins the
# other three to these versions, so they resolve to one copy each.
ironrdp-session = "0.11"
# For `PixelFormat`, which describes the framebuffer's byte order.
ironrdp-graphics = "0.9"
# Dynamic virtual channels, and the display-control channel that rides on one. Both
# are needed for resize: the connector registers neither by itself, and without them
# `encode_resize` returns `None` forever.
ironrdp-dvc = "0.8"
ironrdp-displaycontrol = "0.8"
# The tokio adapter without its `reqwest` feature: that feature exists only for
# the Kerberos network client, and pulling an HTTP stack in for a feature this
# build refuses would be a strange trade. See session.rs.
ironrdp-tokio = "0.10"
# rustls with aws-lc-rs, which is already in the application's graph by way of
# russh, so the two workspaces agree on their TLS implementation. Note that this
# crate upgrades *without* verifying the certificate; crates/proto-rdp/src/server_key.rs
# explains why that is correct for RDP and what replaces it.
ironrdp-tls = { version = "0.2", features = ["rustls-aws-lc-rs"] }

# ---- foundations ---------------------------------------------------------------
# Kept at the same versions as the main workspace. They are separate graphs, but a
# type that crosses the process boundary is described by the same code on both
# sides, so the crates behind it should not drift.
# SHA-256, for pinning a server's public key. Same crate and version as the main
# workspace uses for SSH host key fingerprints.
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1.53", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "time",
    "macros",
] }
tracing = "0.1"

[workspace.lints.rust]
unsafe_code = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
