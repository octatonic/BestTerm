[package]
name = "bestterm-proto-rdp"
description = "RDP for BestTerm, on IronRDP: runs inside the bestterm-rdp helper process"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
bestterm-ipc-frame.workspace = true
# The active stage speaks in `surface` types -- damage rectangles, pixel formats,
# cursor shapes -- because that is what crosses the process boundary. `ipc-frame`
# re-exports them, but naming the crate directly says which vocabulary this is.
bestterm-surface.workspace = true
ironrdp-connector.workspace = true
ironrdp-displaycontrol.workspace = true
ironrdp-dvc.workspace = true
ironrdp-graphics.workspace = true
ironrdp-pdu.workspace = true
ironrdp-session.workspace = true
ironrdp-tls.workspace = true
ironrdp-tokio.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
# Only the tests build a request from scratch; the crate itself receives one already assembled.
bestterm-core-vault.workspace = true
