[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/octatonic/BestTerm"
homepage = "https://github.com/octatonic/BestTerm"
authors = ["BestTerm contributors"]

[workspace.dependencies]
# ---- internal crates ------------------------------------------------------
bestterm-transport = { path = "crates/transport", version = "0.1.0" }
bestterm-surface = { path = "crates/surface", version = "0.1.0" }
bestterm-core-model = { path = "crates/core-model", version = "0.1.0" }
bestterm-config = { path = "crates/config", version = "0.1.0" }
bestterm-core-vault = { path = "crates/core-vault", version = "0.1.0" }
bestterm-importers = { path = "crates/importers", version = "0.1.0" }
bestterm-proto-ssh = { path = "crates/proto-ssh", version = "0.1.0" }
bestterm-ipc-frame = { path = "crates/ipc-frame", version = "0.1.0" }
bestterm-proto-rdp = { path = "crates/proto-rdp", version = "0.1.0" }
bestterm-core-pty = { path = "crates/core-pty", version = "0.1.0" }
bestterm-core-terminal = { path = "crates/core-terminal", version = "0.1.0" }
bestterm-term-render = { path = "crates/term-render", version = "0.1.0" }
bestterm-ui-chrome = { path = "crates/ui-chrome", version = "0.1.0" }
bestterm-app-ui = { path = "crates/app-ui", version = "0.1.0" }

# ---- terminal core --------------------------------------------------------
# Apache-2.0. Wrapped behind bestterm_core_terminal::TerminalEmulator so it can
# be swapped for libghostty-vt later without touching the UI (see ARCHITECTURE.md).
alacritty_terminal = "0.26"
# MIT. ConPTY on Windows, unix ptys elsewhere, behind one trait.
portable-pty = "0.9"

# ---- GUI ------------------------------------------------------------------
# egui/eframe are MIT OR Apache-2.0.
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "wgpu",
    "wayland",
    "x11",
] }
egui_extras = "0.36"
egui_dock = "0.21"

# ---- foundations ----------------------------------------------------------
anyhow = "1.0"
thiserror = "2.0"
crossbeam-channel = "0.5"
parking_lot = "0.12"
bitflags = "2.13"
unicode-width = "0.2"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
directories = "6.0"
# Node identity must survive a rename and a git merge, which rules out both
# path-derived and sequentially-allocated ids. See crates/core-model/src/id.rs.
uuid = { version = "1.24", features = ["v4", "serde"] }

# ---- SSH ----------------------------------------------------------------------
# Pure Rust, async, client and server. Chosen over libssh2 bindings for the
# reasons in docs/ARCHITECTURE.md: BestTerm needs in-process control of channels
# so an SFTP panel can share the terminal's connection.
russh = "0.62"
tokio = { version = "1.53", features = [
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "time",
    "macros",
] }

# ---- cryptography -----------------------------------------------------------
# All RustCrypto, all MIT OR Apache-2.0. The vault's design is documented in
# crates/core-vault/src/lib.rs; these are the primitives it is built from.
argon2 = "0.5"
chacha20poly1305 = "0.11"
zeroize = "1.9"
getrandom = "0.4"
base64 = "0.23"
# HMAC-SHA1 is not a choice: OpenSSH hashes known_hosts entries with it, so
# reading an existing file requires it. SHA-256 is for host key fingerprints.
hmac = "0.13"
sha1 = "0.11"
sha2 = "0.11"

# ---- graphical protocols ----------------------------------------------------
# MIT OR Apache-2.0. Frames reach the main process through a memory mapping
# rather than a pipe: see crates/ipc-frame/src/shared.rs for the arithmetic that
# makes copying eight megabytes thirty times a second the wrong default.
memmap2 = "0.9"

# IronRDP, MIT OR Apache-2.0, from Devolutions. Chosen over FreeRDP bindings
# because it is pure Rust and builds on both targets without a C toolchain; the
# helper-process architecture leaves room to swap in FreeRDP later if IronRDP
# turns out not to cover multi-monitor or device redirection.
#
# The individual crates rather than the `ironrdp` facade: the facade does not
# cover the tokio and TLS adapters, so half the tree would come in through it and
# half around it. `ironrdp-connector` 0.10 pins `ironrdp-pdu` 0.9, which is why
# these two versions go together.
ironrdp-connector = "0.10"
ironrdp-pdu = { version = "0.9", features = ["std"] }

# Test-only. Configuration tests must never touch a developer's real files.
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# The UI layer legitimately holds wide match statements over key codes.
match_same_arms = "allow"

# Debug builds of a terminal emulator are unusable without some optimisation in
# the VT and rendering paths, but full opt makes iteration slow. Optimise only
# the dependencies, which is where the hot loops live during development.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
