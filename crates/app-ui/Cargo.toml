[package]
name = "bestterm-app-ui"
description = "BestTerm application shell: window layout, tabs and input wiring"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
# First time the session model reaches the executable: the Session settings dialog
# produces a `ProtocolConfig`, and this crate is what receives it.
bestterm-config.workspace = true
bestterm-core-model.workspace = true
bestterm-core-pty.workspace = true
# Bringing an existing MobaXterm inventory across is the cheapest way to make this usable
# on day one; see docs/ROADMAP.md.
bestterm-importers.workspace = true
# SSH, and the runtime it needs. The interface is synchronous and the protocol is not, so the
# application owns a runtime and the two speak over channels -- see src/ssh.rs.
bestterm-proto-ssh.workspace = true
bestterm-core-terminal.workspace = true
bestterm-term-render.workspace = true
bestterm-transport.workspace = true
bestterm-ui-chrome.workspace = true
# The relay channel each tab owns; see crates/app-ui/src/tab.rs.
crossbeam-channel.workspace = true
tokio.workspace = true
eframe.workspace = true
egui.workspace = true
tracing.workspace = true
