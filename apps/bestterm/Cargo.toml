[package]
name = "bestterm"
description = "A native cross-platform remote-access workspace: terminal, SSH, RDP, VNC, SFTP and X11"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "bestterm"
path = "src/main.rs"

[dependencies]
bestterm-app-ui.workspace = true
eframe.workspace = true
egui.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# Only on Linux, and only to open a library by name before the windowing layer does -- which turns a
# missing `libxkbcommon-x11` from an abort with a core dump into a sentence naming the package.
[target.'cfg(target_os = "linux")'.dependencies]
libloading.workspace = true
