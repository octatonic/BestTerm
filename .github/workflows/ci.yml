name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Keep CI logs readable and fail fast on genuine errors rather than backtrace noise.
  RUST_BACKTRACE: short

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Windows and Linux are equal targets for this project, so neither is allowed to
  # be "the one we fix later" — both build and test on every push from day zero.
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
          - name: windows-x86_64
            os: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libssl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Formatting
        run: cargo fmt --all -- --check

      # The RDP helper is a separate workspace, so every cargo command has to be run
      # twice: `--workspace` stops at the workspace it is in. See helpers/rdp/Cargo.toml
      # for why the split exists.
      - name: Formatting (RDP helper)
        run: cargo fmt --all --manifest-path helpers/rdp/Cargo.toml -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (RDP helper)
        run: >-
          cargo clippy --manifest-path helpers/rdp/Cargo.toml
          --workspace --all-targets -- -D warnings

      # A real sshd, so the SSH client is tested against a server rather than against
      # our own idea of one. Runs only on Linux; the Windows job still compiles and
      # runs everything else, and the integration tests skip themselves when the
      # environment below is absent.
      - name: Start a test SSH server
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends openssh-server
          sudo mkdir -p /run/sshd /etc/bestterm-sshd

          # A dedicated account, so nothing depends on how the runner's own is set up.
          sudo useradd -m -s /bin/bash bestterm-test
          echo 'bestterm-test:integration-test-password' | sudo chpasswd

          sudo ssh-keygen -q -t ed25519 -N '' -f /etc/bestterm-sshd/host_ed25519
          sudo chmod a+r /etc/bestterm-sshd/host_ed25519.pub

          # UsePAM no keeps this to /etc/shadow and avoids pulling PAM's configuration
          # into the test. StrictModes no because the home directory is freshly made.
          sudo tee /etc/bestterm-sshd/sshd_config >/dev/null <<'CONF'
          Port 2222
          ListenAddress 127.0.0.1
          HostKey /etc/bestterm-sshd/host_ed25519
          PidFile /run/sshd/bestterm.pid
          PasswordAuthentication yes
          PubkeyAuthentication no
          KbdInteractiveAuthentication no
          UsePAM no
          StrictModes no
          AllowUsers bestterm-test
          # Both defaults, stated so the forwarding tests do not depend on a distribution
          # keeping them. GatewayPorts stays off: the tests bind loopback on purpose.
          AllowTcpForwarding yes
          GatewayPorts no
          LogLevel VERBOSE
          CONF

          sudo /usr/sbin/sshd -f /etc/bestterm-sshd/sshd_config
          # Fail loudly here rather than leaving every integration test to time out.
          for _ in $(seq 1 20); do
            if (echo > /dev/tcp/127.0.0.1/2222) >/dev/null 2>&1; then
              echo "sshd is listening"; exit 0
            fi
            sleep 0.5
          done
          echo "sshd did not come up"; sudo cat /var/log/auth.log 2>/dev/null | tail -30; exit 1

      - name: Publish the test server's details
        if: runner.os == 'Linux'
        run: |
          {
            echo "BESTTERM_SSH_TEST_HOST=127.0.0.1"
            echo "BESTTERM_SSH_TEST_PORT=2222"
            echo "BESTTERM_SSH_TEST_USER=bestterm-test"
            echo "BESTTERM_SSH_TEST_PASSWORD=integration-test-password"
            echo "BESTTERM_SSH_TEST_HOST_KEY=$(cat /etc/bestterm-sshd/host_ed25519.pub)"
          } >> "$GITHUB_ENV"

      - name: Tests
        run: cargo test --workspace --all-targets

      - name: Tests (RDP helper)
        run: cargo test --manifest-path helpers/rdp/Cargo.toml --workspace --all-targets

      - name: Build (release)
        run: cargo build --workspace --release

      - name: Build (release, RDP helper)
        run: cargo build --manifest-path helpers/rdp/Cargo.toml --workspace --release

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: bestterm-${{ matrix.name }}
          path: |
            target/release/bestterm
            target/release/bestterm.exe
          if-no-files-found: error
          retention-days: 14

  # Licence hygiene is a hard requirement for a GPLv3 project: a GPLv2-only
  # dependency cannot be linked at all. Catch it at PR time, not at release time.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
      # The helper's graph is its own, so its licences are unchecked unless checked
      # separately. One shared deny.toml, because the rules are the project's and not
      # the workspace's — a GPL-2.0-only dependency is just as unacceptable here.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          manifest-path: ./helpers/rdp/Cargo.toml
          arguments: --all-features --config ./deny.toml

  # Documentation must stay buildable: the trait crates are the contract between
  # layers, and their docs are how that contract is communicated.
  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: docs
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: cargo doc --manifest-path helpers/rdp/Cargo.toml --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
