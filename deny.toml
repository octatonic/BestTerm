# cargo-deny configuration.
#
# BestTerm is licensed GPL-3.0-or-later. That makes license hygiene a build
# concern rather than a paperwork concern: a dependency whose licence is
# incompatible with GPLv3 cannot be linked at all, and GPLv2-only is the trap to
# watch for (it is *not* compatible with GPLv3).
#
# Run locally with:  cargo deny check

[graph]
all-features = true

[licenses]
version = 2
# One file governs two dependency graphs -- the application's and the RDP helper's
# (see helpers/rdp/Cargo.toml for why they are separate). An allowance that is
# unused in one of them is almost always in use in the other, so "this allowance
# was not needed" stopped carrying information and is no longer reported.
unused-allowed-license = "allow"
# Permissive and GPLv3-compatible licences only. Anything not on this list must
# be justified in a PR and added deliberately.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    "MPL-2.0",
    "GPL-3.0",
    "GPL-3.0-or-later",
    "LGPL-2.1-or-later",
    "LGPL-3.0-or-later",
    "OpenSSL",
    "BSL-1.0",

    # Font licences, reached through `epaint_default_fonts`, which bundles the
    # fonts egui falls back to. Both are free/libre and neither restricts the
    # licensing of the program that displays the font, so both are compatible
    # with shipping inside a GPLv3 binary. Allowed deliberately rather than by
    # widening the rules: a *code* dependency arriving under either of these
    # would be a genuine problem and should be caught.
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

# GPLv2-only is deliberately absent from `allow`: linking it into a GPLv3
# program is not permitted. If a dependency turns out to be "GPL-2.0-or-later"
# that IS acceptable and should be added explicitly with a note.

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Keep exactly one copy of the heavy graphics and async stacks.
deny = []
skip-tree = []

[advisories]
version = 2
yanked = "deny"
ignore = [
    # RUSTSEC-2023-0071 — "Marvin Attack": the `rsa` crate's private-key operations
    # are not constant-time, so an observer who can measure them may be able to
    # recover the key. Reached through russh -> rsa.
    #
    # Accepted, deliberately and with a way out:
    #
    # * There is no fixed version. The advisory says a constant-time rewrite is
    #   under way; until it lands there is nothing to upgrade to.
    # * Turning it off costs more than it saves. `rsa` is a default feature of
    #   russh and gates `ssh-key/rsa`, which covers RSA *host key verification*
    #   as well as client keys. Disabling it would make BestTerm unable to
    #   connect to any server that offers only an RSA host key — still a large
    #   share of older infrastructure — to remove a timing sidechannel that only
    #   applies when the *user* authenticates with an RSA private key.
    # * The exposure is narrow: verifying a server's RSA host key is a public-key
    #   operation and is not affected.
    #
    # Revisit when the `rsa` crate ships the constant-time implementation, or if
    # russh gains a way to keep RSA verification without RSA signing.
    { id = "RUSTSEC-2023-0071", reason = "no fixed version exists; disabling RSA would drop host key verification for older servers" },

    # RUSTSEC-2023-0089 — `atomic-polyfill` is unmaintained; its author archived the
    # repository and points at `portable-atomic`. The advisory itself says "no safe
    # upgrade is available". Reached only in the RDP helper's graph, four levels down:
    #
    #   ironrdp-connector -> sspi -> winscard -> iso7816 -> heapless 0.7 -> atomic-polyfill
    #
    # Accepted, because nothing here can be done about it:
    #
    # * There is no fixed version to move to, and no vulnerability — the advisory is
    #   about maintenance status, not a defect.
    # * The crate provides atomics on targets that lack them natively. On x86-64 and
    #   aarch64, which is everything BestTerm builds for, it compiles to the platform's
    #   own atomics.
    # * It arrives through sspi's smart-card support, which `ironrdp-connector` depends
    #   on unconditionally. BestTerm does not offer smart card logon, so none of that
    #   code is reached at runtime either.
    #
    # Revisit when sspi moves to heapless 0.8 or later, which dropped the dependency.
    { id = "RUSTSEC-2023-0089", reason = "unmaintained with no upgrade available; reached only through sspi's unused smart card support" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
